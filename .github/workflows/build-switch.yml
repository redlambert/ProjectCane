name: Build Switch NRO

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build python3 make

      # devkitPro's package server blocks GitHub build machines, so packages
      # cannot be downloaded here. The devkita64 image already ships with the
      # Switch libraries; this step just reports anything that is missing.
      - name: Check Switch libraries
        run: |
          MISSING=""
          for FILE in \
            "$DEVKITPRO/libnx/lib/libdeko3d.a" \
            "$DEVKITPRO/tools/bin/uam" \
            "$DEVKITPRO/tools/bin/elf2nro" \
            "$DEVKITPRO/tools/bin/nacptool" \
            "$DEVKITPRO/portlibs/switch/lib/libavformat.a" \
            "$DEVKITPRO/portlibs/switch/lib/libavcodec.a" \
            "$DEVKITPRO/portlibs/switch/lib/libswscale.a" \
            "$DEVKITPRO/portlibs/switch/lib/libswresample.a" \
            "$DEVKITPRO/portlibs/switch/lib/libavutil.a" \
            "$DEVKITPRO/portlibs/switch/lib/libdav1d.a" \
            "$DEVKITPRO/portlibs/switch/lib/libexpat.a" \
            "$DEVKITPRO/portlibs/switch/lib/libzstd.a" \
            "$DEVKITPRO/portlibs/switch/lib/libz.a" \
            "$DEVKITPRO/portlibs/switch/lib/libbz2.a"
          do
            if [ ! -e "$FILE" ]; then
              echo "MISSING: $FILE"
              MISSING="yes"
            fi
          done
          if [ -n "$MISSING" ]; then
            exit 1
          fi
          echo "All Switch libraries found"

      - name: Provide libelf placeholder if missing
        # The Switch build script requires libelf.a, but no game code uses it
        # and devkitPro does not ship it, so an empty archive satisfies the link.
        run: |
          LIBELF="$DEVKITPRO/portlibs/switch/lib/libelf.a"
          if [ ! -f "$LIBELF" ]; then
            "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-ar" rcs "$LIBELF"
          fi

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/devkitA64-libnx.cmake

      - name: Build
        run: cmake --build build

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: ProjectCane-switch
          path: |
            build/ProjectCane.nro
            build/ProjectCane.elf
